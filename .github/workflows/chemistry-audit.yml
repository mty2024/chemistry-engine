name: Chemistry audit

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemistry-audit
  cancel-in-progress: false

jobs:
  engine:
    name: Tests and self-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-consistency audit
        run: python tools/audit_chemistry.py
      - name: Build wheel and site
        run: |
          python tools/build_dist.py
          python tools/build_site.py
      - name: Validate site
        run: python tools/check_site.py

  playground:
    name: Live playground smoke test
    runs-on: ubuntu-latest
    needs: engine
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run playground smoke test
        run: |
          mkdir -p artifacts
          python tools/check_playground.py --screenshot artifacts/playground.png --wait-seconds 600
      - name: Upload playground screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-audit
          path: artifacts/
          if-no-files-found: ignore
